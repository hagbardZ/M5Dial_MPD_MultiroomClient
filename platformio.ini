; =====================================================================
;  MPD client for round-knob displays - PlatformIO project
;
;  Hardware  : M5Stack M5Dial (ESP32-S3-FN8)          -> env:m5dial
;              Elecrow CrowPanel 1.28" (ESP32-S3R8)   -> env:crowpanel
;  UI        : M5GFX (direct drawing, no LVGL)
;  Libraries : m5stack/M5Dial (M5Unified + M5GFX based)
;
;  Build     : pio run                 (default env)
;              pio run -e crowpanel     (other board)
;  Upload    : pio run -t upload       (USB serial)
;  Monitor   : pio device monitor
; =====================================================================
[platformio]
default_envs = m5dial

[env:m5dial]
platform = espressif32
board = m5stack-dial
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    m5stack/M5Dial@^1.0.3

build_flags =
    -DDEVICE_M5DIAL
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384

; Uncomment and adjust your serial port if auto-detection fails:
; upload_port = /dev/ttyACM0

; ---------------------------------------------------------------------
;  Elecrow CrowPanel 1.28" (DHE38128D) - ESP32-S3R8, 16 MB flash,
;  8 MB OPI PSRAM, 1.28" 240x240 GC9A01 + CST816D touch + rotary knob.
;  M5Unified has no board entry for it, so the display/knob are wired up
;  in include/board_crowpanel.h (M5GFX + M5Unified's button/touch classes).
; ---------------------------------------------------------------------
[env:crowpanel]
platform = espressif32
board = elecrow-crowpanel-128
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    m5stack/M5Unified@^0.2.22

build_flags =
    -DDEVICE_CROWPANEL
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384

; upload_port = /dev/ttyACM0
